name: Sync 1.0.2 release notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-release-notes-1.0.2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.0.2 --notes-file docs/RELEASE_NOTES_1.0.2.md
