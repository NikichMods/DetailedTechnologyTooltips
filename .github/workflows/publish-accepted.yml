name: Publish accepted release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release/accepted-release.env'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-accepted-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Read accepted identity
        id: accepted
        shell: bash
        run: |
          set -euo pipefail
          source .github/release/accepted-release.env
          ASSET_SOURCE="${ASSET_SOURCE:-actions}"
          [[ "$ASSET_SOURCE" = actions || "$ASSET_SOURCE" = release ]]
          {
            echo "asset_source=$ASSET_SOURCE"
            echo "version=$VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "run_id=$RUN_ID"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "dll_sha256=$DLL_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact accepted artifact
        if: steps.accepted.outputs.asset_source == 'actions'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.accepted.outputs.artifact_name }}
          path: accepted
          run-id: ${{ steps.accepted.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify accepted DLL identity
        if: steps.accepted.outputs.asset_source == 'actions'
        shell: bash
        run: |
          set -euo pipefail
          dll="accepted/DetailedTechnologyTooltips.dll"
          test -f "$dll"
          actual="$(sha256sum "$dll" | awk '{print $1}')"
          expected="${{ steps.accepted.outputs.dll_sha256 }}"
          test "$actual" = "$expected"
          grep -F "version=${{ steps.accepted.outputs.version }}" accepted/BUILD_IDENTITY.txt
          grep -F "source_sha=${{ steps.accepted.outputs.source_sha }}" accepted/BUILD_IDENTITY.txt
          grep -F "sha256=$expected" accepted/BUILD_IDENTITY.txt

      - name: Publish GitHub Release
        if: steps.accepted.outputs.asset_source == 'actions'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.accepted.outputs.version }}
          SOURCE_SHA: ${{ steps.accepted.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" accepted/DetailedTechnologyTooltips.dll \
            --target "$SOURCE_SHA" \
            --title "Detailed Technology Tooltips v$VERSION" \
            --notes-file "docs/RELEASE_NOTES_${VERSION}.md"

      - name: Verify externally published accepted DLL
        if: steps.accepted.outputs.asset_source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.accepted.outputs.version }}
          SOURCE_SHA: ${{ steps.accepted.outputs.source_sha }}
          EXPECTED_SHA256: ${{ steps.accepted.outputs.dll_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -x true
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha)" = "$SOURCE_SHA"
          mkdir accepted
          gh release download "v$VERSION" --pattern DetailedTechnologyTooltips.dll --dir accepted
          test "$(sha256sum accepted/DetailedTechnologyTooltips.dll | awk '{print $1}')" = "$EXPECTED_SHA256"
