name: Build production candidate

on:
  push:
    branches:
      - 'dev/**'
      - 'feature/**'
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'DetailedTechnologyTooltips.csproj'
      - 'nuget.config'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify source and version identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Source SHA mismatch' }
          [xml]$project = Get-Content DetailedTechnologyTooltips.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $plugin = Get-Content src/Plugin.cs -Raw
          if ($plugin -notmatch ('PluginVersion = "' + [regex]::Escape($version) + '"')) { throw 'Plugin version mismatch' }
          if ([string]$project.Project.PropertyGroup.AssemblyVersion -ne "$version.0" -or [string]$project.Project.PropertyGroup.FileVersion -ne "$version.0") { throw 'Assembly version mismatch' }
          "DTT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore DetailedTechnologyTooltips.csproj --configfile nuget.config

      - name: Build
        run: dotnet build DetailedTechnologyTooltips.csproj -c Release --no-restore

      - name: Validate localization
        run: dotnet run --project tests/LocalizationTests/LocalizationTests.csproj -c Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          $dll = Resolve-Path 'bin/Release/DetailedTechnologyTooltips.dll'
          $out = Join-Path $PWD 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll (Join-Path $out 'DetailedTechnologyTooltips.dll')
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "version=$env:DTT_VERSION"
            "source_sha=${{ github.sha }}"
            "sha256=$hash"
            "assembly=DetailedTechnologyTooltips.dll"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_IDENTITY.txt')
          Get-Content (Join-Path $out 'BUILD_IDENTITY.txt')

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: DetailedTechnologyTooltips-${{ env.DTT_VERSION }}-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
